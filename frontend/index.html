    <style>
      /* Splash (motion graphic): the two seat blocks of the logo lock together, a dot walks the S aisle to its seat,
         then the wordmark rises. Once per session for the web and once for each role, which it names; skipped on tap,
         still under reduced motion. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(120% 90% at 50% 32%, #0b7a35 0%, #006426 46%, #004d1d 100%);
        color: #fff6e6; transition: opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.36s;
        -webkit-tap-highlight-color: transparent; cursor: pointer;
      }
      #splash::before {
        content: ""; position: absolute; inset: 0; opacity: 0;
        background-image: radial-gradient(circle, rgb(255 246 230 / 0.1) 2px, transparent 2.6px); background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(65% 50% at 50% 42%, #000 0%, transparent 78%); mask-image: radial-gradient(65% 50% at 50% 42%, #000 0%, transparent 78%);
        animation: sp-fade 0.9s 0.05s ease-out forwards;
      }
      #splash .sp-stage { position: relative; display: grid; justify-items: center; gap: 22px; transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1); }
      #splash .sp-mark { position: relative; width: 120px; height: 120px; }
      #splash .sp-mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #splash .sp-a, #splash .sp-b { transform-box: view-box; transform-origin: 128px 128px; }
      #splash .sp-a { animation: sp-in-a 0.64s 0.08s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      #splash .sp-b { animation: sp-in-b 0.64s 0.16s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      #splash .sp-aisle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: sp-draw 0.62s 0.74s cubic-bezier(0.65, 0, 0.35, 1) forwards, sp-out 0.36s 1.42s ease-in forwards; }
      /* the walker lives in the logo's 256-unit space, scaled down with it */
      #splash .sp-walk { position: absolute; left: 0; top: 0; width: 256px; height: 256px; transform: scale(0.46875); transform-origin: 0 0; pointer-events: none; }
      #splash .sp-dot { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #fedc01; box-shadow: 0 0 0 5px rgb(254 220 1 / 0.25); opacity: 0; }
      @supports (offset-path: path("M0 0")) {
        #splash .sp-dot { margin: 0; offset-path: path("M202 86H104A21 21 0 0 0 104 128H152A21 21 0 0 1 152 170H54"); offset-rotate: 0deg; offset-distance: 0%; animation: sp-walk 0.62s 0.74s cubic-bezier(0.65, 0, 0.35, 1) forwards, sp-sit 0.3s 1.36s cubic-bezier(0.55, 0, 1, 0.45) forwards; }
      }
      #splash .sp-word { width: 196px; height: auto; animation: sp-rise 0.56s 1.02s cubic-bezier(0.22, 1, 0.36, 1) both; }
      #splash .sp-tag { margin: -8px 0 0; font: 600 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.01em; text-align: center; color: rgb(255 246 230 / 0.86); animation: sp-rise 0.56s 1.2s cubic-bezier(0.22, 1, 0.36, 1) both; }
      #splash .sp-role { margin-top: -6px; padding: 7px 14px; border-radius: 999px; background: #fedc01; color: #231f20; font: 700 14px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; animation: sp-rise 0.5s 1.3s cubic-bezier(0.22, 1, 0.36, 1) both; }
      #splash .sp-role:empty { display: none; }
      #splash .sp-co { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); left: 50%; translate: -50% 0; padding: 7px 12px; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgb(0 0 0 / 0.18); animation: sp-fade 0.5s 1.38s ease-out both; }
      #splash .sp-co img { display: block; height: 22px; width: auto; }
      .no-splash #splash { display: none; }
      #splash.sp-done { opacity: 0; visibility: hidden; }
      #splash.sp-done .sp-stage { transform: scale(1.06); }
      @keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sp-out { to { opacity: 0; } }
      @keyframes sp-in-a { from { transform: translate(-48px, -48px) rotate(-12deg) scale(0.8); opacity: 0; } 35% { opacity: 1; } to { transform: none; opacity: 1; } }
      @keyframes sp-in-b { from { transform: translate(48px, 48px) rotate(12deg) scale(0.8); opacity: 0; } 35% { opacity: 1; } to { transform: none; opacity: 1; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-walk { 0% { offset-distance: 0%; opacity: 1; } 100% { offset-distance: 100%; opacity: 1; } }
      @keyframes sp-sit { from { offset-distance: 100%; opacity: 1; transform: scale(1); } to { offset-distance: 100%; opacity: 0; transform: scale(0); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash .sp-stage { transition-duration: 0.15s; }
        #splash::before, #splash *, #splash .sp-dot { animation: none !important; }
        #splash::before { opacity: 1; }
        #splash .sp-aisle, #splash .sp-dot { display: none; }
      }
    </style>
    <script>
      // Decided before the body is parsed, so a skipped splash never paints. The web plays it once per session, and so
      // does each role (pengunjung /app, panitia /admin, petugas /staff) the first time it is opened; src/lib/splash.ts
      // plays a role's splash when it is entered from inside the app.
      ;(function () {
        var role = /^\/(app|admin|staff)(\/|$)/.exec(location.pathname)
        var key = 'summarevent:splash' + (role ? ':' + role[1] : '')
        var skip = false
        try {
          if (sessionStorage.getItem(key)) skip = true
          else {
            sessionStorage.setItem(key, '1')
            sessionStorage.setItem('summarevent:splash', '1')
          }
        } catch (e) {}
        if (skip) document.documentElement.classList.add('no-splash')
      })()
    </script>

      // The app ends the splash once it has rendered (src/lib/splash.ts); a tap skips the rest of the motion. A copy is
      // kept for the role splashes, and a role page names its role (the same names as ROLE_LABEL in src/lib/splash.ts).
      ;(function () {
        var el = document.getElementById('splash')
        window.__splashTpl = el.cloneNode(true)
        if (document.documentElement.classList.contains('no-splash')) return el.remove()
        var role = /^\/(app|admin|staff)(\/|$)/.exec(location.pathname)
        if (role) el.querySelector('.sp-role').textContent = { app: 'Pengunjung', admin: 'Panitia', staff: 'Petugas' }[role[1]]
        window.__splashAt = performance.now()
        el.addEventListener('click', function () {
          if (window.__splashSkip) window.__splashSkip()
        })
      })()
    </script>
